name: site

on:
  push:
    branches: [main, revamp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install site dependencies
        run: python -m pip install --disable-pip-version-check "jinja2==3.1.6"

      - name: Check generated site is current
        run: python scripts/build_site.py --check

      - name: Check Python syntax
        run: python -m py_compile scripts/build_site.py

      - name: Check shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: Validate JSON data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("site/data").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok: {path}")
          PY

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/
          if-no-files-found: error
